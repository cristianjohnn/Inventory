# ===========================================
# Production Docker Compose
# Full stack: PostgreSQL + Express + Nginx (serves React)
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ===========================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inventory-net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: inventory-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    restart: unless-stopped
    networks:
      - inventory-net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: inventory-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - inventory-net

volumes:
  pgdata:
    name: inventory-pgdata-prod

networks:
  inventory-net:
    name: inventory-network
